<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>North Signal</title>
    <meta name="description" content="North Signal - Sistema de análisis de campañas publicitarias y centro de operaciones para Google Ads." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <meta property="og:title" content="North Signal" />
    <meta property="og:description" content="North Signal - Sistema de análisis de campañas publicitarias y centro de operaciones para Google Ads." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <!-- Filtro de refracción Liquid Glass. Solo Chrome lo aplica como backdrop-filter;
         el resto usa el esmerilado de index.css sin distorsión. scale=6 es sutil a
         propósito: se nota en el borde de un drawer, no deforma cifras. -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
      <filter id="glass-refract" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency="0.008 0.012" numOctaves="2" seed="3" result="noise"/>
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="6" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
    </svg>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
